<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on a
		     notched phone; without it the sticky bars sat under the home indicator. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" />
		<link rel="manifest" href="/manifest.webmanifest?v=5" />
		<link rel="icon" href="/collie.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/patrl-192.png" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<!-- "tap", not "hover": hover fires on touchstart, so scrolling the agent
	     list loaded a transcript for every row the thumb brushed past. -->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
