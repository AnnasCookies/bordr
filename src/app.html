<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on a
		     notched phone; without it the sticky bars sat under the home indicator.

		     interactive-widget=resizes-content is what keeps the composer above
		     the on-screen keyboard. The default (resizes-visual) leaves the
		     LAYOUT viewport full height when the keyboard opens, so a
		     `sticky bottom-0` bar stays pinned to the bottom of a viewport the
		     keyboard is now covering — the send button simply vanishes. This
		     shrinks the layout viewport instead, and dvh units follow it. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#0a0a0a" />
		<link rel="manifest" href="/manifest.webmanifest?v=5" />
		<!-- Both, in this order: an SVG-capable browser takes collie.svg and
		     ignores the .ico; everything else falls back to favicon.ico rather
		     than requesting /favicon.ico blind and 404ing. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/collie.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/patrl-192.png" />
		<meta name="text-scale" content="scale" />
		<!--
			Stamp the theme before the first paint.

			The layout does this too, but not until hydration — and the CSS
			fallback for "no class yet" can only ask the SYSTEM. So a phone set
			to light, running bordr set to dark, painted a white page for as long
			as it took the bundle to arrive and then swapped. Blocking on
			purpose: it is a few dozen bytes, and anything async is another
			frame of the wrong colour.
		-->
		<script>
			try {
				var t = JSON.parse(localStorage.getItem('bordr-prefs') || '{}').theme || 'system';
				var dark =
					t === 'dark' ||
					(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.add(dark ? 'dark' : 'light');
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#0a0a0a' : '#f4f5f7');
			} catch (e) {
				// A private window with storage blocked still gets the media query.
			}
		</script>
		%sveltekit.head%
	</head>
	<!-- "tap", not "hover": hover fires on touchstart, so scrolling the agent
	     list loaded a transcript for every row the thumb brushed past. -->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
