name: CI

# Every push to main and every pull request. The stack that added terminal
# mode landed 76 commits with nothing checking any of them, and three browser
# tests had been failing since its first commit without anyone noticing.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: a PR that changes package.json without committing
      # the lockfile should fail here rather than silently resolve to
      # something nobody has run locally.
      - name: Install
        run: bun install --frozen-lockfile

      # Formatting and lint first: it is the cheapest failure and the one
      # most likely to be a one-line fix.
      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run check

      - name: Unit tests
        run: bun run test:unit --run

      # The build is its own check: an adapter or config error shows up
      # nowhere else, and the deploy script runs it unattended.
      - name: Build
        run: bun run build

# Deliberately not here: the Playwright suite. It drives a real herdr with
# real agent panes, so it cannot run on a clean runner — `firstPane()` would
# skip every test and the job would pass green while proving nothing. Run it
# locally with `bun run test:e2e`, and prefer `--workers=1`: the suite shares
# one live herdr and goes red at random under parallel load.
